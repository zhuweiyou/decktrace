[workspace]
resolver = "2"
members = [
    "crates/tracking",
    "crates/jjddz",
    "crates/capture",
    "crates/decktrace",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "rayon"] }
imageproc = { version = "0.27", default-features = false, features = ["rayon"] }
rayon = "1.10"
thiserror = "2"
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
crossbeam-channel = "0.5"
screencapturekit = "11.1"
eframe = "0.37"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
