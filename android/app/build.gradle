plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zhuweiyou.decktrace'
    compileSdk 34

    defaultConfig {
        applicationId 'com.zhuweiyou.decktrace'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1'
        ndk { abiFilters 'arm64-v8a' }
    }

    sourceSets {
        main {
            // 直接复用仓库里的模板与牌面资源，避免重复拷贝
            assets.srcDirs += [
                '../../crates/hlddz-mobile/assets',
                '../../crates/decktrace/assets'
            ]
        }
    }

    buildTypes {
        debug { }
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
