[target.'cfg(target_os = "macos")'.dependencies]
decktrace-capture-macos = { path = "../decktrace-capture-macos" }

[target.'cfg(target_os = "windows")'.dependencies]
decktrace-capture-windows = { path = "../decktrace-capture-windows" }
