[[bin]]
name = "decktrace"
path = "src/main.rs"

[dependencies]
decktrace-game-jj = { path = "../decktrace-game-jj" }
decktrace-core = { path = "../decktrace-core" }
anyhow.workspace = true
clap.workspace = true
crossbeam-channel.workspace = true
eframe.workspace = true
